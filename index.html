<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="brand/nwh-mark-white.png">
<meta property="og:title" content="Near Wild Heaven">
<meta property="og:description" content="Not near enough. LA-based label for warped beats and liquid breaks.">
<meta property="og:image" content="https://nearwildheaven.org/brand/nwh-orbit-still.jpg">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Near Wild Heaven</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Near Wild Heaven. LA-based label for warped beats and liquid breaks.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&display=swap">
<style>
  /* Layout: same terminal printout as keyspan.org. One column, all lowercase, one monospace face, black and white.
     The label name is cut out of a black veil so the turning chrome render shows through the letters;
     the rest of the render glows faintly behind. Scanlines and a rolling band over everything. */
  :root {
    --ground: #000000;
    --ink: #ffffff;
    --ink-muted: #a3a3a3;
    --line: #333333;
    --veil: #1f1f1f;
    --stroke: rgba(255, 255, 255, 0.55);
    --scan: rgba(255, 255, 255, 0.035);
    --band: rgba(255, 255, 255, 0.05);
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --glyph: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
    --size: 14px;
    --lh: 1.6;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font: 400 var(--size)/var(--lh) var(--mono);
    text-transform: lowercase;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--ink); color: var(--ground); }

  body::before, body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  body::before { background: repeating-linear-gradient(to bottom, var(--scan) 0 1px, transparent 1px 3px); }
  body::after {
    background: linear-gradient(to bottom, transparent 0, var(--band) 50%, transparent 100%);
    height: 18vh; inset: auto 0 auto 0; top: -20vh;
    animation: roll 9s linear infinite;
  }
  @keyframes roll { to { transform: translateY(140vh); } }

  a { color: var(--ink); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
  a:hover { background: var(--ink); color: var(--ground); text-decoration: none; }
  a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .g { font-family: var(--glyph); color: var(--ink-muted); }

  .page {
    min-height: 100%;
    max-width: 1100px;
    margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 28px 32px;
    display: grid;
    grid-template-rows: auto 1fr auto auto;
    gap: 40px;
  }

  .bar { display: flex; justify-content: space-between; align-items: center; gap: 16px; color: var(--ink-muted); }
  .ks { display: block; line-height: 0; padding: 4px; }
  .ks img { display: block; width: 92px; height: auto; }
  .ks:hover { background: none; opacity: 0.6; }

  /* the cut-out: video underneath, a veil with white letters on top, multiplied */
  .hero { position: relative; overflow: hidden; align-self: center; background: var(--ground); isolation: isolate; }
  .hero video, .hero .still { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .knock {
    position: relative;
    margin: 0;
    background: var(--veil);
    color: var(--ink);
    mix-blend-mode: multiply;
    font: 700 clamp(56px, 15.5vw, 176px)/0.88 var(--mono);
    letter-spacing: -0.04em;
    padding: 0.12em 0.06em 0.16em;
    white-space: pre;
  }
  .outline {
    position: absolute; inset: 0; margin: 0; pointer-events: none;
    color: transparent; -webkit-text-stroke: 1px var(--stroke);
    font: 700 clamp(56px, 15.5vw, 176px)/0.88 var(--mono);
    letter-spacing: -0.04em;
    padding: 0.12em 0.06em 0.16em;
    white-space: pre;
  }
  .hero.tear .knock, .hero.tear .outline { transform: translateX(var(--dx, 0)) skewX(var(--sk, 0)); }

  .line { margin: 0; max-width: 60ch; font-size: 15px; }
  .line .under { animation: blink 1.05s steps(1) infinite; color: var(--ink-muted); }
  @keyframes blink { 50% { opacity: 0; } }

  footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  footer .g { font-size: 12px; letter-spacing: 0.2em; }
  footer .links { display: flex; gap: 2ch; }

  @media (prefers-reduced-motion: reduce) {
    body::after { display: none; }
    .line .under { animation: none; }
  }
  @media (max-width: 640px) {
    :root { --size: 12px; }
    .page { gap: 32px; }
    .ks img { width: 76px; }
    .line { font-size: 13px; }
  }
</style>

<div class="page">

  <div class="bar">
    <span class="g" aria-hidden="true">&#9618;&#9617; nwh</span>
    <a class="ks" href="https://keyspan.org" title="Keyspan"><img src="brand/keyspan-wordmark-white.svg" alt="Keyspan" width="1610" height="143"></a>
  </div>

  <div class="hero" id="hero">
    <img class="still" src="brand/nwh-orbit-still.jpg" alt="" aria-hidden="true">
    <video id="orbit" muted loop playsinline autoplay preload="none" aria-hidden="true"></video>
    <h1 class="knock" id="knock" aria-label="Near Wild Heaven">near
wild
heaven</h1>
    <p class="outline" id="outline" aria-hidden="true">near
wild
heaven</p>
  </div>

  <p class="line">not near enough.<br>la-based label for warped beats and liquid breaks.<span class="under" aria-hidden="true">_</span></p>

  <footer>
    <span class="g" aria-hidden="true">&#8961; &#8756; &#10209; &#9618;&#9617;</span>
    <span class="links">
      <a href="https://www.instagram.com/near.wild.heaven_/" target="_blank" rel="noopener">ig</a>
      <a class="mail" data-u="team" data-d="nearwildheaven.org" href="#">team [at] nearwildheaven [dot] org</a>
    </span>
  </footer>

</div>

<script>
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // email: assembled here so the address never sits in the page source for scrapers
  for (const a of document.querySelectorAll("a.mail")) {
    const addr = `${a.dataset.u}@${a.dataset.d}`;
    a.href = "mailto:" + addr;
    a.textContent = addr;
  }

  // the render: still frame at once, the 2.8MB loop after the page has loaded. It turns even with reduced motion on.
  const orbit = document.getElementById("orbit");
  const startOrbit = () => {
    orbit.src = "brand/nwh-orbit.mp4";
    const p = orbit.play();
    if (p && p.catch) p.catch(() => {});
  };
  if (document.readyState === "complete") setTimeout(startOrbit, 200);
  else addEventListener("load", () => setTimeout(startOrbit, 200), { once: true });

  // glitch: the name scrambles through block glyphs (chrome shows through them) and tears sideways
  const hero = document.getElementById("hero");
  const layers = [document.getElementById("knock"), document.getElementById("outline")];
  const FINAL = layers[0].textContent;
  const NOISE = "░▒▓█▀▄▌▐▖▗▘▝▚▞≡§∆∴¬✦";
  let busy = false;
  const glitch = (frames = 14) => {
    if (busy) return;
    busy = true;
    let f = 0;
    const tick = () => {
      f++;
      const solid = Math.floor((f / frames) * FINAL.length);
      const text = [...FINAL].map((ch, i) => i < solid || ch === "\n" || Math.random() < 0.55 ? ch : NOISE[Math.floor(Math.random() * NOISE.length)]).join("");
      for (const l of layers) l.textContent = text;
      hero.classList.toggle("tear", f % 3 !== 0 && f < frames - 2);
      hero.style.setProperty("--dx", `${(Math.random() - 0.5) * 18}px`);
      hero.style.setProperty("--sk", `${(Math.random() - 0.5) * 6}deg`);
      if (f < frames) setTimeout(tick, 40);
      else { for (const l of layers) l.textContent = FINAL; hero.classList.remove("tear"); busy = false; }
    };
    tick();
  };
  if (!still) {
    setTimeout(() => glitch(20), 500);
    const loop = () => setTimeout(() => { if (!document.hidden) glitch(); loop(); }, 2800 + Math.random() * 4200);
    loop();
    hero.addEventListener("mouseenter", () => glitch());
  }
</script>

</body>
</html>
