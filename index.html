<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="brand/nwh-mark-white.png">
<meta property="og:title" content="Near Wild Heaven">
<meta property="og:description" content="Not near enough. LA-based label for warped beats and liquid breaks.">
<meta property="og:image" content="https://nearwildheaven.org/brand/nwh-orbit-still.jpg">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Near Wild Heaven</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Near Wild Heaven. LA-based label for warped beats and liquid breaks.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&display=swap">
<style>
  /* Layout: same terminal printout as keyspan.org. One column, lowercase, one monospace face, black and white.
     The label name (caps) is cut out of a dark veil; behind it the turning chrome render is redrawn as
     a low-resolution 1-bit dither, so the letters fill with chunky pixel dots. Glitches always run. */
  :root {
    --ground: #000000;
    --ink: #ffffff;
    --ink-muted: #a3a3a3;
    --line: #333333;
    --veil: #262626;
    --stroke: rgba(255, 255, 255, 0.6);
    --scan: rgba(255, 255, 255, 0.035);
    --band: rgba(255, 255, 255, 0.05);
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --glyph: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
    --size: 14px;
    --lh: 1.6;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font: 400 var(--size)/var(--lh) var(--mono);
    text-transform: lowercase;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--ink); color: var(--ground); }

  body::before, body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  body::before { background: repeating-linear-gradient(to bottom, var(--scan) 0 1px, transparent 1px 3px); }
  body::after {
    background: linear-gradient(to bottom, transparent 0, var(--band) 50%, transparent 100%);
    height: 18vh; inset: auto 0 auto 0; top: -20vh;
    animation: roll 9s linear infinite;
  }
  @keyframes roll { to { transform: translateY(140vh); } }

  a { color: var(--ink); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
  a:hover { background: var(--ink); color: var(--ground); text-decoration: none; }
  a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .g { font-family: var(--glyph); color: var(--ink-muted); }

  .page {
    min-height: 100%;
    max-width: 1100px;
    margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 28px 32px;
    display: grid;
    grid-template-rows: auto 1fr auto auto;
    gap: 36px;
  }

  .bar { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  .bar .g { white-space: nowrap; overflow: hidden; text-overflow: clip; }
  .ks { display: block; line-height: 0; padding: 4px; flex: 0 0 auto; }
  .ks img { display: block; width: 92px; height: auto; }
  .ks:hover { background: none; opacity: 0.6; }

  .stage { align-self: center; display: grid; gap: 10px; }
  .frame { position: relative; padding: 14px; }
  .frame .c { position: absolute; font-family: var(--glyph); color: var(--ink-muted); line-height: 1; font-size: 14px; }
  .frame .tl { top: 0; left: 0; } .frame .tr { top: 0; right: 0; }
  .frame .bl { bottom: 0; left: 0; } .frame .br { bottom: 0; right: 0; }

  /* the cut-out: dithered render underneath, a veil with white letters on top, multiplied */
  .hero { position: relative; overflow: hidden; background: var(--ground); isolation: isolate; }
  .hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
  .hero video { position: absolute; width: 2px; height: 2px; opacity: 0; pointer-events: none; }
  .knock, .outline {
    margin: 0;
    font: 700 clamp(52px, 15vw, 172px)/0.88 var(--mono);
    letter-spacing: -0.04em;
    text-transform: uppercase;
    padding: 0.12em 0.06em 0.16em;
    white-space: pre;
  }
  .knock { position: relative; background: var(--veil); color: var(--ink); mix-blend-mode: multiply; }
  .outline { position: absolute; inset: 0; pointer-events: none; color: transparent; -webkit-text-stroke: 1px var(--stroke); }
  .hero.tear .knock, .hero.tear .outline { transform: translateX(var(--dx, 0)) skewX(var(--sk, 0)); }

  .strip { margin: 0; font-family: var(--glyph); color: var(--ink-muted); white-space: nowrap; overflow: hidden; letter-spacing: 0.1em; font-size: 12px; }

  .copy { display: grid; grid-template-columns: auto 1fr; gap: 0 2ch; align-items: start; max-width: 70ch; }
  .copy .g { font-size: 13px; line-height: 1.85; }
  .line { margin: 0; font-size: 15px; }
  .line .under { animation: blink 1.05s steps(1) infinite; color: var(--ink-muted); }
  @keyframes blink { 50% { opacity: 0; } }

  footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  footer .g { font-size: 12px; letter-spacing: 0.2em; }
  footer .links { display: flex; gap: 2ch; flex-wrap: wrap; }

  @media (max-width: 640px) {
    :root { --size: 12px; }
    .page { gap: 28px; }
    .ks img { width: 76px; }
    .line { font-size: 13px; }
    .frame { padding: 10px; }
  }
</style>

<div class="page">

  <div class="bar">
    <span class="g" aria-hidden="true">&#9618;&#9617; nwh &#8961; 34.0522&deg;n 118.2437&deg;w &#8756; rx</span>
    <a class="ks" href="https://keyspan.org" title="Keyspan"><img src="brand/keyspan-wordmark-white.svg" alt="Keyspan" width="1610" height="143"></a>
  </div>

  <div class="stage">
    <div class="frame">
      <span class="c tl" aria-hidden="true">&#9484;</span><span class="c tr" aria-hidden="true">&#9488;</span>
      <span class="c bl" aria-hidden="true">&#9492;</span><span class="c br" aria-hidden="true">&#9496;</span>
      <div class="hero" id="hero">
        <canvas id="dither" aria-hidden="true"></canvas>
        <video id="orbit" muted loop playsinline preload="none" aria-hidden="true"></video>
        <h1 class="knock" id="knock" aria-label="Near Wild Heaven">near
wild
heaven</h1>
        <p class="outline" id="outline" aria-hidden="true">near
wild
heaven</p>
      </div>
    </div>
    <p class="strip" id="strip" aria-hidden="true"></p>
  </div>

  <div class="copy">
    <span class="g" aria-hidden="true">&#10022;<br>&#8756;</span>
    <p class="line">not near enough.<br>la-based label for warped beats and liquid breaks.<span class="under" aria-hidden="true">_</span></p>
  </div>

  <footer>
    <span class="g" aria-hidden="true">&#8961; &#8756; &#10209; &#9618;&#9617;</span>
    <span class="links">
      <a href="https://www.instagram.com/near.wild.heaven_/" target="_blank" rel="noopener">ig</a>
      <a class="mail" data-u="team" data-d="nearwildheaven.org" href="#">team [at] nearwildheaven [dot] org</a>
    </span>
  </footer>

</div>

<script>
  // Effects run for everyone, including viewers with reduced motion on: they are part of the identity.

  // email: assembled here so the address never sits in the page source for scrapers
  for (const a of document.querySelectorAll("a.mail")) {
    const addr = `${a.dataset.u}@${a.dataset.d}`;
    a.href = "mailto:" + addr;
    a.textContent = addr;
  }

  const NOISE = "░▒▓█▀▄▌▐▖▗▘▝▚▞≡§∆∴¬✦⌁⟡";
  const pick = () => NOISE[Math.floor(Math.random() * NOISE.length)];

  // ---- dithered render -------------------------------------------------------------
  // The chrome loop is drawn into a tiny canvas, thresholded against a 4x4 Bayer matrix to pure
  // black/white, and scaled back up with hard pixel edges. Before the video arrives, the still is used.
  const hero = document.getElementById("hero");
  const canvas = document.getElementById("dither");
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  const video = document.getElementById("orbit");
  const still = new Image();
  still.src = "brand/nwh-orbit-still.jpg";
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + 0.5) * 16);
  let cell = 5;            // CSS pixels per dither dot; jumps around during glitches
  let tears = [];          // [rowStart, rowEnd, shift] bands torn sideways during glitches
  let invertBand = null;   // [rowStart, rowEnd] flipped black/white for a frame or two

  const source = () => (video.readyState >= 2 && !video.paused ? video : (still.complete && still.naturalWidth ? still : null));

  const draw = () => {
    const src = source();
    if (!src) return;
    const w = Math.max(24, Math.round(hero.clientWidth / cell));
    const h = Math.max(12, Math.round(hero.clientHeight / cell));
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    const sw = src.videoWidth || src.naturalWidth, sh = src.videoHeight || src.naturalHeight;
    const scale = Math.max(w / sw, h / sh);
    const dw = sw * scale, dh = sh * scale;
    ctx.drawImage(src, (w - dw) / 2, (h - dh) / 2, dw, dh);
    const img = ctx.getImageData(0, 0, w, h);
    const d = img.data;
    for (let y = 0; y < h; y++) {
      const inv = invertBand && y >= invertBand[0] && y < invertBand[1];
      for (let x = 0; x < w; x++) {
        const i = (y * w + x) * 4;
        let l = d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114;
        l = (l - 18) * 1.7;                         // lift the chrome, crush the black
        let on = l > BAYER[(y & 3) * 4 + (x & 3)];
        if (inv) on = !on;
        const v = on ? 255 : 0;
        d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255;
      }
    }
    for (const [a, b, s] of tears) {
      for (let y = a; y < Math.min(b, h); y++) {
        const row = d.slice(y * w * 4, (y + 1) * w * 4);
        for (let x = 0; x < w; x++) {
          const from = ((x - s) % w + w) % w;
          d.set(row.subarray(from * 4, from * 4 + 4), (y * w + x) * 4);
        }
      }
    }
    ctx.putImageData(img, 0, 0);
  };

  let last = 0;
  const frame = t => {
    if (t - last > 1000 / 24) { last = t; draw(); }
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
  still.addEventListener("load", draw);

  // the 2.8MB loop loads after the page is done
  const startOrbit = () => {
    video.src = "brand/nwh-orbit.mp4";
    const p = video.play();
    if (p && p.catch) p.catch(() => {});
  };
  if (document.readyState === "complete") setTimeout(startOrbit, 200);
  else addEventListener("load", () => setTimeout(startOrbit, 200), { once: true });

  // ---- glitch --------------------------------------------------------------------
  // The name scrambles through block glyphs and tears sideways; the dither's dot size jumps,
  // bands of rows slip and one band flips black/white.
  const layers = [document.getElementById("knock"), document.getElementById("outline")];
  const FINAL = layers[0].textContent;
  let busy = false;
  const glitch = (frames = 14) => {
    if (busy) return;
    busy = true;
    let f = 0;
    const tick = () => {
      f++;
      const solid = Math.floor((f / frames) * FINAL.length);
      const text = [...FINAL].map((ch, i) => i < solid || ch === "\n" || Math.random() < 0.55 ? ch : pick()).join("");
      for (const l of layers) l.textContent = text;
      hero.classList.toggle("tear", f % 3 !== 0 && f < frames - 2);
      hero.style.setProperty("--dx", `${(Math.random() - 0.5) * 18}px`);
      hero.style.setProperty("--sk", `${(Math.random() - 0.5) * 6}deg`);
      cell = [3, 5, 8, 12][Math.floor(Math.random() * 4)];
      const rows = canvas.height || 40;
      tears = Array.from({ length: 1 + Math.floor(Math.random() * 3) }, () => {
        const a = Math.floor(Math.random() * rows);
        return [a, a + 1 + Math.floor(Math.random() * rows * 0.18), Math.round((Math.random() - 0.5) * 24)];
      });
      invertBand = Math.random() < 0.35 ? (a => [a, a + 2 + Math.floor(Math.random() * 6)])(Math.floor(Math.random() * rows)) : null;
      if (f < frames) setTimeout(tick, 40);
      else {
        for (const l of layers) l.textContent = FINAL;
        hero.classList.remove("tear");
        cell = 5; tears = []; invertBand = null;
        busy = false;
      }
    };
    tick();
  };
  setTimeout(() => glitch(20), 500);
  const loop = () => setTimeout(() => { if (!document.hidden) glitch(); loop(); }, 2800 + Math.random() * 4200);
  loop();
  hero.addEventListener("mouseenter", () => glitch());

  // ---- glyph strip under the name: a carrier signal that keeps shifting ----------------
  const strip = document.getElementById("strip");
  const carrier = n => Array.from({ length: n }, (_, i) => (i % 9 === 0 ? " " : pick())).join("");
  let len = 0;
  const sizeStrip = () => { len = Math.ceil(strip.clientWidth / 7.8); strip.textContent = carrier(len); };
  sizeStrip();
  addEventListener("resize", sizeStrip);
  setInterval(() => {
    const chars = [...strip.textContent];
    for (let k = 0; k < 6; k++) { const i = Math.floor(Math.random() * chars.length); if (chars[i] !== " ") chars[i] = pick(); }
    strip.textContent = chars.join("");
  }, 140);
</script>

</body>
</html>
